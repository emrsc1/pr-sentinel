[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "AI-assisted pull request triage for open source maintainers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "emrsc1" }]
dependencies = []

[project.scripts]
pr-sentinel = "pr_sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
